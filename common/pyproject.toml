[project]
name = "mfa-common"
version = "0.1.0"
description = "Shared utilities for MFA platform services (logging, config helpers)"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfa_common"]
