[project]
name = "mfa-ml"
version = "0.1.0"
description = "MFA rules engine, XGBoost ensemble, and calibration"
requires-python = ">=3.12"
dependencies = [
    "mfa-common",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    # shap: use xgboost native SHAP (pred_contribs=True) to avoid llvmlite/numba
    # TODO(MVP): re-evaluate external shap when numba supports Python 3.14+
    "pandas>=2.2",
    "numpy>=1.26",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfa_ml"]

[tool.uv.sources]
mfa-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
