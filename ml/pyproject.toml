[project]
name = "mfa-ml"
version = "0.1.0"
description = "MFA rules engine, XGBoost ensemble, and calibration (POC stub)"
requires-python = ">=3.12"
dependencies = [
    "mfa-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfa_ml"]

[tool.uv.sources]
mfa-common = { workspace = true }
